server:
  port: 8080

spring:
  application:
    name: zenbooking

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/zenbooking
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
